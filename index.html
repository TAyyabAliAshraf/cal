<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌞 Solar Off-Grid Rechner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            background: linear-gradient(45deg, #FFD700, #FF8C00, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            font-weight: 700;
        }
        .header p {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: rgba(255,255,255,0.9);
            margin: 10px 0 0;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            flex: 1;
            transition: all 0.3s ease;
        }
        .panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }
        .left-panel { border-top: 4px solid #FFD700; }
        .right-panel { border-top: 4px solid #4ECDC4; }
        h2 {
            color: #FF8C00;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
        }
        h3 {
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 600px; /* Ensures horizontal scroll on small screens */
        }
        th {
            background: linear-gradient(135deg, #FF8C00, #FF4500);
            color: white;
            padding: 15px 12px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        td {
            padding: 15px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: background 0.2s;
            vertical-align: middle;
        }
        tr:hover td {
            background: rgba(255,140,0,0.05);
        }
        .device-name input[type="text"] {
            width: 100%;
            font-weight: 600;
            text-align: left;
            color: #333;
            font-size: 0.95rem;
            padding: 10px 12px;
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            background: white;
            transition: all 0.3s;
            margin: 0;
        }
        .device-name input[type="text"]:focus {
            outline: none;
            border-color: #FF8C00;
            box-shadow: 0 0 0 4px rgba(255,140,0,0.1);
            transform: scale(1.02);
        }
        .total-row {
            background: linear-gradient(135deg, #FFF3CD, #FFEAA7);
            font-weight: 700;
            font-size: 1.1rem;
        }
        input[type="number"] {
            width: 70px;
            padding: 10px 12px;
            border: 2px solid #E9ECEF;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: white;
            margin: 0;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #FF8C00;
            box-shadow: 0 0 0 4px rgba(255,140,0,0.1);
            transform: scale(1.02);
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 3px solid #000;
            border-radius: 20px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            box-shadow:
                10px 10px 20px #d1d1d1,
                -10px -10px 20px #ffffff;
        }
        label {
            display: block;
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 1rem;
        }
        .solar-options {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .solar-btn {
            padding: 12px 20px;
            border: 3px solid #333;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            min-width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .solar-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .solar-btn.selected {
            border-color: #FFD700;
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #333;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.1), 0 10px 20px rgba(255,215,0,0.3);
        }
        .solar-btn[data-wp="260"].selected {
            background: linear-gradient(145deg, #4A90E2, #357ABD);
            color: white;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.1), 0 10px 20px rgba(74,144,226,0.4);
        }
        .solar-btn[data-wp="310"].selected {
            background: linear-gradient(145deg, #FF6B35, #F7931E);
            color: white;
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.1), 0 10px 20px rgba(255,107,53,0.4);
        }
        .total-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .total-info strong {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        #chartContainer {
            position: relative;
            height: 450px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        #displayNet {
            font-size: 1.3rem !important;
            font-weight: 700 !important;
        }
        .icon {
            font-size: 1.2rem;
        }
        /* Enhanced Responsive Design */
        @media (max-width: 1024px) {
            .container {
                gap: 20px;
            }
            .panel {
                padding: 25px;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                flex-direction: column;
                gap: 20px;
            }
            .panel {
                padding: 20px;
                border-radius: 16px;
            }
            h2 {
                font-size: 1.4rem;
                margin-bottom: 20px;
            }
            h3 {
                font-size: 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            .table-wrapper {
                margin-bottom: 20px;
                -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            }
            table {
                font-size: 0.85rem;
                min-width: 500px;
            }
            th, td {
                padding: 10px 8px;
            }
            input[type="number"], .device-name input[type="text"] {
                width: 100%;
                margin: 2px 0;
                font-size: 0.9rem;
            }
            .device-name input[type="text"] {
                text-align: center;
            }
            .solar-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
                min-width: 90px;
                flex: 1 1 auto;
                max-width: 120px;
            }
            .solar-options {
                gap: 10px;
            }
            .section {
                padding: 15px;
            }
            label {
                font-size: 0.95rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }
            input[type="number"] {
                width: 80px;
                max-width: 100%;
            }
            .total-info {
                padding: 20px;
                font-size: 1rem;
            }
            .total-info strong {
                font-size: 0.95rem;
            }
            #displayNet {
                font-size: 1.2rem !important;
            }
            #chartContainer {
                height: 350px;
            }
        }
        @media (max-width: 480px) {
            .header {
                margin-bottom: 20px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .panel {
                padding: 15px;
            }
            table {
                min-width: 450px;
                font-size: 0.8rem;
            }
            th, td {
                padding: 8px 6px;
            }
            .solar-btn {
                padding: 8px 12px;
                font-size: 0.85rem;
                min-width: 80px;
            }
            #chartContainer {
                height: 300px;
            }
            .total-info {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-solar-panel"></i> Solar Off-Grid Rechner</h1>
        <p>Berechne deine perfekte Solaranlage für Camper & Wohnmobil 🚐⚡</p>
    </div>
    <div class="container">
        <div class="left-panel panel">
            <h2><i class="fas fa-plug"></i> Geräteverbrauch</h2>
            <div class="table-wrapper">
                <table id="consumptionTable">
                    <thead>
                        <tr>
                            <th>Gerät</th>
                            <th>Leistung<br><i class="fas fa-bolt"></i> W</th>
                            <th>Laufzeit pro Tag<br><i class="far fa-clock"></i> h</th>
                            <th>Tagesverbrauch<br><i class="fas fa-battery-full"></i> Wh</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows populated by JS -->
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td><strong>Gesamt</strong></td>
                            <td id="totalPower">-</td>
                            <td id="totalHours">-</td>
                            <td id="totalWh"><strong>0</strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="section">
                <h3><i class="fas fa-car-battery"></i> Batterie</h3>
                <label>
                    Batterietyp: <strong>AGM</strong> |
                    Nennkapazität: <input type="number" id="batteryAh" value="75" min="1" step="1">
                    <i class="fas fa-info-circle" title="12V System"></i> Ah
                </label>
            </div>
            <div class="section">
                <h3><i class="fas fa-solar-panel"></i> Solarmodul</h3>
                <label>
                    Modul: <span id="selectedWp" style="font-weight: 700; color: #FF8C00;">155</span> Wp
                    × <input type="number" id="numPanels" value="1" min="1" step="1">
                    Paneele
                </label>
                <label>
                    ☀️ Sonnensunden/Tag: <input type="number" id="sunHours" value="8" min="0" step="0.5">
                </label>
                <div class="solar-options">
                    <button class="solar-btn selected" data-wp="155" title="Kompakt">
                        <i class="fas fa-solar-panel"></i> 155 Wp
                    </button>
                    <button class="solar-btn" data-wp="260" title="Standard">
                        <i class="fas fa-solar-panel"></i> 260 Wp
                    </button>
                    <button class="solar-btn" data-wp="310" title="Power">
                        <i class="fas fa-solar-panel"></i> 310 Wp
                    </button>
                </div>
            </div>
            <div class="total-info">
                <strong>Tagesverbrauch: <span id="displayConsume">0</span> Wh</strong>
                <strong>🌞 Erzeugung: <span id="displayGen">0</span> Wh</strong>
                <strong>⚡ Netto/Tag: <span id="displayNet">0</span> Wh</strong>
            </div>
        </div>
        <div class="right-panel panel">
            <h2><i class="fas fa-chart-line"></i> Batterie SOC über 14 Tage</h2>
            <div id="chartContainer">
                <canvas id="socChart"></canvas>
            </div>
        </div>
    </div>
    <script>
        // Same JS as before - fully functional!
        const SYSTEM_VOLTAGE = 12;
        const INVERTER_EFF = 0.85;
        const SOLAR_EFF = 0.70;
        const devices = [
            { name: '📱 Smartphone', leistung: 10, laufzeit: 2, duty: 1.0 },
            { name: '❄️ Kühlbox Kompressor', leistung: 55, laufzeit: 24, duty: 0.20 },
            { name: '🔥 Standheizung', leistung: 56, laufzeit: 6, duty: 1.0 },
            { name: '⚡ Verbraucher 4', leistung: 40, laufzeit: 2, duty: 1.0 },
            { name: '🔌 Verbraucher 5', leistung: 30, laufzeit: 3, duty: 1.0 },
            { name: '🔋 Verbraucher 6', leistung: 0, laufzeit: 0, duty: 1.0 }
        ];
        let chart;
        function initTable() {
            const tbody = document.querySelector('#consumptionTable tbody');
            tbody.innerHTML = '';
            devices.forEach((device, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="device-name"><input type="text" data-index="${index}" data-type="name" value="${device.name}"></td>
                    <td><input type="number" data-index="${index}" data-type="leistung" value="${device.leistung}" min="0" step="1"></td>
                    <td><input type="number" data-index="${index}" data-type="laufzeit" value="${device.laufzeit}" min="0" step="0.1"></td>
                    <td id="wh-${index}">0</td>
                `;
                tbody.appendChild(row);
            });
            attachEventListeners();
            updateCalculations();
        }
        function attachEventListeners() {
            document.querySelectorAll('input[type="number"], input[type="text"]').forEach(input => {
                input.addEventListener('input', updateCalculations);
            });
            document.querySelectorAll('.solar-btn').forEach(btn => {
                btn.addEventListener('click', selectSolarModule);
            });
            ['batteryAh', 'numPanels', 'sunHours'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateChart);
            });
        }
        function updateCalculations() {
            let totalWh = 0;
            let totalP = 0;
            let totalH = 0;
            devices.forEach((device, index) => {
                const nameInput = document.querySelector(`[data-index="${index}"][data-type="name"]`);
                const leistungInput = document.querySelector(`[data-index="${index}"][data-type="leistung"]`);
                const laufzeitInput = document.querySelector(`[data-index="${index}"][data-type="laufzeit"]`);
               
                device.name = nameInput ? nameInput.value : device.name;
                device.leistung = parseFloat(leistungInput.value) || 0;
                device.laufzeit = parseFloat(laufzeitInput.value) || 0;
               
                const wh = device.leistung * device.laufzeit * device.duty;
                document.getElementById(`wh-${index}`).textContent = Math.round(wh);
                totalWh += wh;
                totalP += device.leistung;
                totalH += device.laufzeit;
            });
            document.getElementById('totalWh').textContent = Math.round(totalWh);
            document.getElementById('totalPower').textContent = Math.round(totalP);
            document.getElementById('totalHours').textContent = Math.round(totalH * 10) / 10;
            document.getElementById('displayConsume').textContent = Math.round(totalWh);
            updateChart();
        }
        function selectSolarModule(e) {
            document.querySelectorAll('.solar-btn').forEach(b => b.classList.remove('selected'));
            e.target.classList.add('selected');
            document.getElementById('selectedWp').textContent = e.target.dataset.wp;
            document.getElementById('selectedWp').style.color = e.target.dataset.wp === '155' ? '#FF8C00' :
                                                               e.target.dataset.wp === '260' ? '#4A90E2' : '#FF6B35';
            updateChart();
        }
        function updateChart() {
            const totalAcWh = parseFloat(document.getElementById('totalWh').textContent) || 0;
            const drainWh = totalAcWh / INVERTER_EFF;
            const ah = parseFloat(document.getElementById('batteryAh').value) || 75;
            const batWh = ah * SYSTEM_VOLTAGE;
            const wpPer = parseFloat(document.getElementById('selectedWp').textContent) || 155;
            const numPanels = parseFloat(document.getElementById('numPanels').value) || 1;
            const totalWp = wpPer * numPanels;
            const sunHours = parseFloat(document.getElementById('sunHours').value) || 8;
            const genWh = totalWp * sunHours * SOLAR_EFF;
            const netWh = genWh - drainWh;
            document.getElementById('displayGen').textContent = Math.round(genWh);
            document.getElementById('displayNet').textContent = Math.round(netWh);
            document.getElementById('displayNet').style.color = netWh >= 0 ? '#4ECDC4' : '#FF6B6B';
            const ctx = document.getElementById('socChart').getContext('2d');
            if (chart) chart.destroy();
            let soc = 100;
            const labels = [];
            const data = [];
            labels.push('Tag 0');
            data.push(100);
            for (let day = 1; day <= 14; day++) {
                soc = Math.max(0, Math.min(100, soc + (netWh / batWh) * 100));
                labels.push(`Tag ${day}`);
                data.push(Math.round(soc * 10) / 10);
            }
            const selectedBtn = document.querySelector('.solar-btn.selected');
            const color = selectedBtn.dataset.wp === '155' ? '#FFD700' :
                          selectedBtn.dataset.wp === '260' ? '#4A90E2' :
                          '#FF6B35';
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'SOC %',
                        data: data,
                        borderColor: color,
                        backgroundColor: `${color}20`,
                        borderWidth: 5,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: color,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            ticks: { color: '#666', font: { size: 12 } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#666', font: { size: 11 } }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    },
                    animation: {
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    }
                }
            });
        }
        initTable();
        updateChart();
    </script>
</body>
</html>
